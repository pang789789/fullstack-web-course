<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript 사칙연산 계산기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 계산기 전체를 감싸는 영역 -->
    <main class="calculator">
        <h1>사칙연산 계산기</h1>
        <p>두 숫자와 연산자를 선택한 후 계산 버튼을 누르세요.</p>

        <!-- 첫 번째 숫자: label의 for와 input의 id를 같은 값으로 연결 -->
        <label for="firstNumber">첫 번째 숫자</label>
        <input id="firstNumber" type="text" inputmode="decimal" placeholder="숫자를 입력하세요">

        <!-- value에는 JavaScript에서 사용할 실제 연산자 값을 저장 -->
        <label for="operator">연산자</label>
        <select id="operator">
            <option value="+">더하기 (+)</option>
            <option value="-">빼기 (-)</option>
            <option value="*">곱하기 (*)</option>
            <option value="/">나누기 (/)</option>
        </select>

        <!-- 두 번째 숫자 -->
        <label for="secondNumber">두 번째 숫자</label>
        <input id="secondNumber" type="text" inputmode="decimal" placeholder="숫자를 입력하세요">

        <!-- type="button"은 버튼 클릭 시 폼이 자동 제출되는 것을 방지 -->
        <button id="calculateButton" type="button">계산</button>
    </main>

    <!-- HTML 요소가 만들어진 뒤 JavaScript가 실행되도록 body 마지막에 연결 -->
    <script src="app.js"></script>
    <!-- 계산 함수가 정상 동작하는지 Console에서 자동 확인하는 테스트 코드 -->
    <script src="test.js"></script>
</body>
</html>
